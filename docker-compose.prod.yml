# Production compose. Different from docker-compose.yml in:
#   - Uses Dockerfile (multi-stage standalone build), not Dockerfile.dev
#   - No volume-mount of source code → image is the source of truth
#   - No pgadmin (security)
#   - Postgres port not exposed to host (only to internal network)
#   - App listens on 3000 internally; reverse-proxy (nginx/Caddy/Traefik)
#     in front terminates TLS and forwards there
#   - `restart: always` on everything
#
# The app image is built by ./scripts/deploy.sh (NOT by `docker compose
# build`) because the build stage needs network access to the postgres
# service for generateStaticParams + prerendering, which compose v2 build
# can't provide cleanly. See deploy.sh for the full pipeline.
#
# Required env vars (in .env at repo root):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   PAYLOAD_SECRET, CRON_SECRET, PREVIEW_SECRET
#   NEXT_PUBLIC_SERVER_URL (the public domain, https://...)
#   NEXT_PUBLIC_MAPBOX_TOKEN (Mapbox token)

services:
  postgres:
    # pgvector/pgvector:pg15 — drop-in postgres:15 + pgvector extension.
    # Если оригинал недоступен из RU — заменить на собственный mirror.
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Пробрасываем порт ТОЛЬКО на loopback (не наружу) — нужно для того,
    # чтобы `docker build --network=host` мог достучаться до Postgres
    # на этапе сборки (BuildKit не умеет в кастомные docker-сети через
    # --network=<имя>, поддерживает только host / none / default).
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # HuggingFace TEI — embedding-сервер.
  # По умолчанию multilingual-e5-small (384-dim, ~1.5 GB RAM пиком).
  # Если на сервере 12+ GB — можно поменять на BAAI/bge-m3 + EMBEDDING_DIM=1024
  # и пересоздать таблицу property_embeddings под vector(1024).
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    restart: unless-stopped
    command:
      - --model-id=intfloat/multilingual-e5-small
      - --port=80
      - --max-batch-tokens=4096
      - --auto-truncate
    volumes:
      - tei_models:/data
    environment:
      HF_HOME: /data
      HUGGINGFACE_HUB_CACHE: /data
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # Опциональный dockerized nginx как reverse-proxy. По умолчанию
  # отключён через profile=nginx — поднимется только если явно
  # передать `--profile nginx`. До этого продолжает работать
  # хост-nginx, проксирующий 127.0.0.1:3000 (см. docs/README.md).
  #
  # Перейти на докеризированный вариант:
  #   1. sudo systemctl disable --now nginx     (отключить хост-nginx)
  #   2. docker compose -f docker-compose.prod.yml --profile nginx up -d
  #   3. Сертификаты Let's Encrypt остаются на хосте, certbot renew
  #      продолжает работать через --webroot (см. volume mounts).
  nginx:
    image: nginx:1.27-alpine
    profiles: ['nginx']
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL-сертификаты с хоста — certbot обновляет их там же.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME webroot (для certbot --webroot renew).
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    depends_on:
      app:
        condition: service_started

  app:
    # Образ собирается через scripts/deploy.sh (docker build с --network=host
    # чтобы достучаться до postgres на этапе билда). compose up подхватывает
    # уже готовый тег. Секция build: ниже — fallback для `compose build`:
    # все NEXT_PUBLIC_* должны попасть в bundle на этапе сборки.
    image: realty-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_MAPBOX_STYLE: ${NEXT_PUBLIC_MAPBOX_STYLE:-mapbox://styles/mapbox/streets-v12}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
    restart: always
    ports:
      - '127.0.0.1:3000:3000'   # bind only to loopback; reverse-proxy fronts it
    environment:
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
      NEXT_PUBLIC_MAPBOX_STYLE: ${NEXT_PUBLIC_MAPBOX_STYLE:-mapbox://styles/mapbox/streets-v12}
      NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
      NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID:-}
      CRON_SECRET: ${CRON_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      # OAuth провайдеры (см. docs/AUTH-OAUTH-SETUP.md)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      MAILRU_CLIENT_ID: ${MAILRU_CLIENT_ID:-}
      MAILRU_CLIENT_SECRET: ${MAILRU_CLIENT_SECRET:-}
      # AI-поиск
      EMBEDDINGS_URL: http://tei:80
      EMBEDDING_MODEL: multilingual-e5-small
      EMBEDDING_DIM: "384"
      NODE_ENV: production
    volumes:
      # Media uploads — persisted between deploys.
      - ./public/media:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  tei_models:
