## Главный конфиг nginx — версия для docker-сервиса.
##
## Логика та же что и хост-вариант (см. README/troubleshooting), но
## proxy_pass идёт на `app:3000` через docker DNS, а не на 127.0.0.1.
##
## Включить:
##   1. На хосте `sudo systemctl disable --now nginx` (старый сервис)
##   2. Освободить 80/443
##   3. `docker compose -f docker-compose.prod.yml up -d nginx`
##
## Сертификаты — bind-mount с хоста /etc/letsencrypt, certbot
## продолжает работать на хосте через --webroot в /var/www/letsencrypt
## (тот же путь монтируется в nginx-контейнер).

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    types_hash_max_size 2048;

    # WebSocket upgrade conditional — без этого Connection: upgrade
    # ставится на каждый запрос даже когда клиент о нём не просил.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Сжатие — HTML/JSON/CSS/JS жмутся ~70%.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    include /etc/nginx/conf.d/*.conf;
}
