## Build + Deploy pipeline.
##
## Триггеры:
##   • push на main           → build image, push в GHCR, deploy на сервер.
##   • workflow_dispatch       → ручной запуск из Actions UI.
##
## Поток:
##   1. build  — собирает образ в Docker Buildx с GHA-кэшем слоёв,
##                пушит в ghcr.io/<owner>/<repo>:latest + :sha-XXXXXXX.
##   2. deploy — по SSH делает на сервере docker pull + compose up
##                + apply migrations. Если build упал — deploy не идёт.
##
## Secrets, которые надо завести в GitHub (Settings → Secrets → Actions):
##   • SSH_HOST                  IP или домен сервера
##   • SSH_USER                  root / deploy / whatever
##   • SSH_KEY                   private SSH key (можно сгенерировать
##                                 ssh-keygen -t ed25519, public — в
##                                 ~/.ssh/authorized_keys на сервере)
##   • SSH_PORT                  опционально, дефолт 22
##   • PAYLOAD_SECRET, CRON_SECRET, PREVIEW_SECRET
##   • NEXT_PUBLIC_SERVER_URL    https://megadomic.ru
##   • NEXT_PUBLIC_MAPBOX_TOKEN  (опц.) pk.eyJ1...
##   • NEXT_PUBLIC_MAPBOX_STYLE  (опц.)
##
## Также — после первого пуша сделать image публичным один раз:
##   github.com/<owner>/<repo>/pkgs/container/<repo> → Package settings
##   → Change visibility → Public. Иначе сервер не сможет pull без PAT.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Postgres-сервис для build-time payload.init() (generateStaticParams).
    # Без него next build падает ECONNREFUSED при попытке достучаться до БД.
    # На проде build делает ./scripts/deploy.sh через --network=host и реальный
    # контейнер postgres; на GHA — этот service.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: builduser
          POSTGRES_PASSWORD: buildpass
          POSTGRES_DB: builddb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U builduser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}
      image_sha_tag: ${{ steps.sha-tag.outputs.tag }}
      image_name_lower: ${{ steps.repo-lower.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name (Docker registry requires it)
        id: repo-lower
        run: |
          name="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # network=host чтобы buildkit видел postgres-сервис на 127.0.0.1:5432
          driver-opts: network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo-lower.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Short SHA tag (for SSH step)
        id: sha-tag
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Infisical CLI получает секреты для build-args (NEXT_PUBLIC_* и
      # серверные секреты, которые пекутся в bundle на этапе build).
      # Единственное что должно быть в GitHub Secrets — INFISICAL_TOKEN.
      - name: Install Infisical CLI
        run: |
          curl -1sLf \
            'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' \
            | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical
          infisical --version

      # Прогоняем миграции против postgres-сервиса до билда — иначе
      # next build падает на `relation "header" does not exist` когда
      # server components обращаются к Globals.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0
      - name: Setup Node 22 + pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          PAYLOAD_SKIP_DEPENDENCY_CHECKS: "true"
      - name: Run migrations against build-postgres
        env:
          DATABASE_URI: postgresql://builduser:buildpass@127.0.0.1:5432/builddb
          PAYLOAD_SECRET: build-time-noop-secret-for-migrate-only
        run: pnpm payload migrate

      - name: Fetch secrets from Infisical
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          # EU-регион требует override URL. Если используешь US — можно
          # не задавать (CLI сходит на app.infisical.com по умолчанию).
          INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL || 'https://eu.infisical.com/api' }}
        run: |
          # --format=dotenv даёт `KEY="VALUE"` (со ВКЛЮЧЁННЫМИ кавычками).
          # GITHUB_ENV не делает unwrap кавычек — process.env получит их
          # литералом и URL/JSON-парсинг падает. Поэтому снимаем сами.
          set -e
          infisical export --env=prod --format=dotenv > /tmp/secrets.env
          while IFS='=' read -r k v; do
            [[ -z "$k" || "$k" == \#* ]] && continue
            # Снимаем парные кавычки если value ими обёрнут
            v="${v%\"}"; v="${v#\"}"
            v="${v%\'}"; v="${v#\'}"
            # Пропускаем пустые значения — они только мешают (next.config
            # делает `new URL(NEXT_PUBLIC_SERVER_URL)` и падает на "")
            [[ -z "$v" ]] && continue
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done < /tmp/secrets.env
          rm /tmp/secrets.env
          echo "Загружено секретов: $(wc -l < $GITHUB_ENV)"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # network=host чтобы внутри билда payload мог достучаться до
          # postgres-сервиса GHA-job'а на 127.0.0.1:5432
          network: host
          # GHA cache → последующие билды переиспользуют node_modules
          # и Next.js cache. Первый билд ~10мин, повторные 2-3мин.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ env.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ env.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_MAPBOX_STYLE=${{ env.NEXT_PUBLIC_MAPBOX_STYLE }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ env.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
            NEXT_PUBLIC_GA4_ID=${{ env.NEXT_PUBLIC_GA4_ID }}
            DATABASE_URI=postgresql://builduser:buildpass@127.0.0.1:5432/builddb
            PAYLOAD_SECRET=${{ env.PAYLOAD_SECRET }}
            CRON_SECRET=${{ env.CRON_SECRET }}
            PREVIEW_SECRET=${{ env.PREVIEW_SECRET }}

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # Если build упал — сюда не зайдём (needs гарантирует).
    # Не запускаем на PR'ах и форках — push к main только.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: SSH → pull image, restart app, migrate
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Параметризуем image-tag через env — внутри script их видно.
          envs: IMAGE_TAG,REGISTRY,REPO,GITHUB_ACTOR,GITHUB_TOKEN
          script_stop: true
          script: |
            set -euo pipefail

            cd /root/payloadcms-realestate-template

            echo "▸ Pull latest code (compose + migrations + scripts)..."
            git fetch origin main
            git reset --hard origin/main

            echo "▸ Login to GHCR for pull..."
            echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

            echo "▸ Pull new image: $REGISTRY/$REPO:$IMAGE_TAG"
            docker pull "$REGISTRY/$REPO:$IMAGE_TAG"

            # docker-compose.prod.yml ссылается на тег `realty-app:latest`.
            # Перетегиваем pulled-образ под этим именем — compose up
            # подхватит без правок compose-файла.
            docker tag "$REGISTRY/$REPO:$IMAGE_TAG" realty-app:latest

            echo "▸ Recreate app container..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate app

            echo "▸ Wait for app to respond..."
            for i in $(seq 1 60); do
              if curl -fs http://127.0.0.1:3000/ -o /dev/null 2>&1; then
                echo "  ✓ App responding."
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "  ✗ App not responding after 2min — see logs:"
                docker compose -f docker-compose.prod.yml logs --tail 50 app
                exit 1
              fi
              sleep 2
            done

            echo "▸ Apply pending migrations..."
            # CRON_SECRET достаём из Infisical (если установлена CLI)
            # или из .env как fallback. Логика та же что в deploy.sh.
            if command -v infisical &>/dev/null && [[ -n "${INFISICAL_TOKEN_SERVER:-}" ]] || [[ -f .infisical.json ]]; then
              SECRET=$(infisical secrets get CRON_SECRET --env=prod --plain 2>/dev/null || echo "")
            fi
            if [[ -z "${SECRET:-}" ]] && [[ -f .env ]]; then
              SECRET=$(grep '^CRON_SECRET=' .env | cut -d= -f2)
            fi
            if [[ -z "${SECRET:-}" ]]; then
              echo "  ⚠ Не удалось получить CRON_SECRET — миграция пропущена"
            else
              MIGRATE_RES=$(curl -sS -X POST http://127.0.0.1:3000/api/admin/migrate \
                -H "Authorization: Bearer $SECRET" \
                -H 'Content-Type: application/json' -d '{}')
              echo "  $MIGRATE_RES"
            fi

            echo "▸ Cleanup old images (keep last 3)..."
            docker images "$REGISTRY/$REPO" --format '{{.ID}} {{.CreatedAt}}' \
              | sort -k2 -r | tail -n +4 | awk '{print $1}' \
              | xargs -r docker rmi -f 2>/dev/null || true

            echo "✅ Deploy complete."
        env:
          REGISTRY: ghcr.io
          REPO: ${{ needs.build.outputs.image_name_lower }}
          IMAGE_TAG: ${{ needs.build.outputs.image_sha_tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
